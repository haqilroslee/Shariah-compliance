name: Update ETF holdings

on:
  schedule:
    - cron: "17 19 * * 1-5"   # 19:17 UTC Mon-Fri = early morning in Sydney, after the providers publish
  workflow_dispatch:           # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl
      - run: python scripts/update_holdings.py
      - name: Save changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_holdings
          if git diff --cached --quiet; then
            echo "No holdings changed."
          else
            git commit -m "Update ETF holdings files"
            git push
          fi
